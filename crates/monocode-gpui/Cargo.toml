[package]
name = "monocode-gpui"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
monocode-core = { path = "../monocode-core" }
log = "0.4"
pulldown-cmark = "0.13.5"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-channel = "2"
base64 = "0.22"
# Attachment chips build their thumbnail sprites directly.
image = { version = "0.25", default-features = false }
# The terminal dock: PTY, VT parser and grid (as Zed's terminal uses).
alacritty_terminal = "0.26"
libc = "0.2"
rquickjs = "0.14.0"
# The file editor's native syntax: incremental parses, highlights, folds and
# syntax errors. Languages without a grammar here use the QuickJS fallback.
tree-sitter = "0.26"
tree-sitter-language = "0.1"
streaming-iterator = "0.1"
# The checkout watcher: writes only, so reads elsewhere cost nothing.
inotify = "0.11"
mio = { version = "1", features = ["os-poll"] }
similar = "2.7"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-ruby = "0.23"
tree-sitter-zig = "1.1"

[dev-dependencies]
rusqlite.workspace = true
gpui-kit = { version = "0.9.1", features = ["gpui-fast", "test-support"] }

# Experimental native builds resolve separately from the production Tauri app.
[workspace]
resolver = "2"
members = [".", "../monocode-core", "../monocode-host"]

[workspace.package]
version = "0.16.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"], default-features = false }

# Screen capture stays out of the native app: the optional zed-scap
# dependency resolves to a local stub with no implementation.
[patch.crates-io]
zed-scap = { path = "../../vendor/zed-scap-stub" }

[profile.native-dev]
inherits = "dev"
debug = 0
incremental = false

[profile.native-dev.package."*"]
opt-level = 1

[profile.native-dev.package.monocode-gpui]
opt-level = 1
