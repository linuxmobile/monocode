[workspace]
resolver = "2"
members = ["crates/native-sign"]
exclude = ["vendor/portable-pty", "vendor/gpui-pre", "vendor/gpui-pre-linux", "crates/monocode-core", "crates/monocode-gpui", "crates/monocode-host"]

[workspace.package]
version = "0.16.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
