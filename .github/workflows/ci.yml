name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  host:
    name: Host checks (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config
      - run: cargo fmt --manifest-path crates/monocode-gpui/Cargo.toml --all --check
      - run: cargo clippy --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-host --all-targets --profile native-dev -- -D warnings
      - run: cargo test --manifest-path crates/monocode-gpui/Cargo.toml --locked -p monocode-host --profile native-dev
      # The build and release tooling is Rust now, so it is tested like code.
      - run: cargo test --locked --manifest-path xtask/Cargo.toml
      - name: Fail if Node.js source returns
        run: |
          # TypeScript and Node configuration were removed deliberately. Embedded
          # JavaScript assets are exempt: they are data the app loads, not source
          # that needs building. See docs/native/embedded-assets.md.
          found=$(git ls-files | grep -E '\.(mjs|cjs|ts|tsx)$|(^|/)(package\.json|package-lock\.json|tsconfig\.json|vitest\.config\.ts)$' || true)
          if [ -n "$found" ]; then
            echo "Node.js source or configuration was added back:"
            echo "$found"
            exit 1
          fi
          echo "No Node.js source or configuration."